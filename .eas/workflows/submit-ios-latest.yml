name: Submit latest iOS build to TestFlight

on:
  push:
    branches: ['main']

jobs:
  get_ios_build:
    name: Get latest production iOS build
    type: get-build
    params:
      platform: ios
      profile: production
      distribution: store
      channel: production

  submit_ios:
    name: Submit iOS build to TestFlight
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: testflight
    params:
      build_id: ${{ needs.get_ios_build.outputs.build_id }}
      profile: production
