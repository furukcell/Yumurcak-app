workflows:
  yumurcak-android-aab:
    name: Yumurcak Android AAB
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      groups:
        - yumurcak
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Check Expo SDK dependencies
        script: |
          npx expo install --fix
      - name: Setup EAS
        script: |
          npm install -g eas-cli
          eas whoami || true
      - name: Build Android AAB with EAS (Local)
        script: |
          eas build --platform android --profile production --non-interactive --local
    artifacts:
      - "*.aab"
      - "**/*.aab"
  yumurcak-android-apk:
    name: Yumurcak Android APK
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      groups:
        - yumurcak
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Check Expo SDK dependencies
        script: |
          npx expo install --fix
      - name: Setup EAS
        script: |
          npm install -g eas-cli
          eas whoami || true
      - name: Build Android APK with EAS (Local)
        script: |
          eas build --platform android --profile preview --non-interactive --local
    artifacts:
      - "*.apk"
      - "**/*.apk"
  yumurcak-ios-build:
    name: Yumurcak iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      groups:
        - yumurcak
      vars:
        EXPO_ASC_KEY_ID: $ASC_KEY_ID
        EXPO_ASC_ISSUER_ID: $ASC_ISSUER_ID
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Check Expo SDK dependencies
        script: |
          npx expo install --fix
      - name: Setup EAS
        script: |
          npm install -g eas-cli
          eas whoami || true
      - name: Write ASC API Key file
        script: |
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > $CM_BUILD_DIR/AuthKey.p8
          echo "EXPO_ASC_API_KEY_PATH=$CM_BUILD_DIR/AuthKey.p8" >> $CM_ENV
      - name: Build iOS with EAS (Local)
        script: |
          eas build --platform ios --profile production --non-interactive --local
      - name: Submit to App Store Connect
        script: |
          eas submit --platform ios --profile production --non-interactive --latest
    artifacts:
      - "*.ipa"
      - "**/*.ipa"
  yumurcak-ios-submit-only:
    name: Yumurcak iOS Submit Only
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      groups:
        - yumurcak
      vars:
        EXPO_ASC_KEY_ID: $ASC_KEY_ID
        EXPO_ASC_ISSUER_ID: $ASC_ISSUER_ID
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Setup EAS CLI
        script: |
          npm install -g eas-cli
      - name: Write ASC API Key file
        script: |
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > $CM_BUILD_DIR/AuthKey.p8
          echo "EXPO_ASC_API_KEY_PATH=$CM_BUILD_DIR/AuthKey.p8" >> $CM_ENV
      - name: Submit latest EAS build to App Store Connect
        script: |
          eas submit --platform ios --profile production --non-interactive --latest
