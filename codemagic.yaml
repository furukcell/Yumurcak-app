workflows:
  yumurcak-android-aab:
    name: Yumurcak Android AAB
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      groups:
        - yumurcak
      node: 20.18.0
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Check app config
        script: |
          node -e "const app=require('./app.json').expo; console.log('App:', app.name, app.version); console.log('Android package:', app.android.package); console.log('Android versionCode:', app.android.versionCode); console.log('SDK:', app.android.compileSdkVersion, app.android.targetSdkVersion, app.android.minSdkVersion);"

      - name: Expo prebuild Android
        script: |
          npx expo prebuild --clean --platform android

      - name: Build Google Play AAB with Gradle
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean bundleRelease

      - name: Show build outputs
        script: |
          echo "AAB dosyaları:"
          find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name "*.aab" -print || true

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
        notify:
          success: true
          failure: true
