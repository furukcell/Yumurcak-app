workflows:
  yumurcak-android-apk:
    name: Yumurcak Android APK
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      groups:
        - yumurcak
      node: 20.18.0
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Expo prebuild Android
        script: |
          npx expo prebuild --clean --platform android

      - name: Build standalone APK with Gradle
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
        notify:
          success: true
          failure: true
