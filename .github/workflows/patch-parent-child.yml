name: Apply parent child selection integration v4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch_parent_child.py
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patch_parent_child.py .github/workflows/patch-parent-child.yml
          git add src/screens/parent/parentShared.js .github/patch_parent_child.py .github/workflows/patch-parent-child.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(parent): integrate shared child selection"
          git push
