name: Apply parent child selection integration v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parent shared
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/parent/parentShared.js')
          s = p.read_text(encoding='utf-8')
          marker = "import { useAuth } from '../../context/AuthContext';"
          if "../../context/ParentChildContext" not in s:
              s = s.replace(marker, marker + "\nimport { useParentChild } from '../../context/ParentChildContext';", 1)
          s = s.replace("  const selectedChild = children[0] || null;", "  const { selectedChild } = useParentChild();", 1)
          marker = "  const bottomSafePadding = 96 + Math.max(insets.bottom || 0, 8);"
          if "parentChildren" not in s:
              s = s.replace(marker, marker + "\n  const { children: parentChildren, selectedChild: shellSelectedChild, selectChild } = useParentChild();", 1)
          marker = "      </View>\n      <KeyboardAvoidingView"
          selector = '''      </View>
      {parentChildren.length > 1 ? (
        <ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={{ paddingHorizontal: 14, paddingVertical: 8 }}>
          {parentChildren.map((child) => {
            const isSelected = String(child.id) === String(shellSelectedChild?.id);
            const name = `${child.ad || child.adSoyad || child.isim || 'Çocuk'} ${child.soyad || ''}`.trim();
            return (
              <TouchableOpacity key={child.id} onPress={() => selectChild(child.id)} activeOpacity={0.8}
                style={{ marginRight: 8, paddingHorizontal: 14, paddingVertical: 8, borderRadius: 18, borderWidth: 1, borderColor: isSelected ? THEME.primary : THEME.border, backgroundColor: isSelected ? THEME.primarySoft : THEME.card }}>
                <Text style={{ fontSize: 13, fontWeight: '800', color: isSelected ? THEME.primary : THEME.text }}>{name}</Text>
              </TouchableOpacity>
            );
          })}
        </ScrollView>
      ) : null}
      <KeyboardAvoidingView'''
          if "parentChildren.length > 1" not in s and marker in s:
              s = s.replace(marker, selector, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-parent-child.yml
          git add src/screens/parent/parentShared.js .github/workflows/patch-parent-child.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(parent): integrate shared child selection"
          git push
