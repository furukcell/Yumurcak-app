name: Fix Parent Runtime

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix parent shared styles and child loading race
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shared = Path('src/screens/parent/parentShared.js')
          text = shared.read_text(encoding='utf-8')

          old = '''function useParentSharedStyles() {
            const { theme } = useAppTheme();
            syncTheme(theme);
            return useMemo(() => createStyles(theme || THEME), [theme]);
          }'''
          new = '''function createStyles(theme) {
            const t = theme || THEME;
            return StyleSheet.create({
              safeArea: { flex: 1, backgroundColor: t.bg },
              screen: { flex: 1, backgroundColor: t.bg },
              scrollContent: { paddingHorizontal: 16, paddingTop: 12 },
              header: { minHeight: 64, paddingHorizontal: 16, paddingVertical: 10, flexDirection: 'row', alignItems: 'center', backgroundColor: t.card, borderBottomWidth: 1, borderBottomColor: t.border },
              backButton: { minWidth: 72, flexDirection: 'row', alignItems: 'center', paddingVertical: 8 },
              backArrow: { fontSize: 32, lineHeight: 32, color: t.primary, fontWeight: '400' },
              backLabel: { marginLeft: 4, fontSize: 14, fontWeight: '800', color: t.primary },
              backSpacer: { width: 72 },
              headerTitleWrap: { flex: 1, alignItems: 'center', paddingHorizontal: 8 },
              headerTitle: { fontSize: 17, fontWeight: '900', color: t.text, textAlign: 'center' },
              headerSubtitle: { marginTop: 2, fontSize: 11, fontWeight: '700', color: t.muted, textAlign: 'center' },
              headerEmoji: { width: 36, textAlign: 'center', fontSize: 22 },
              center: { flex: 1, alignItems: 'center', justifyContent: 'center', backgroundColor: t.bg, paddingHorizontal: 24 },
              loadingText: { marginTop: 12, color: t.muted, fontSize: 14, fontWeight: '800', textAlign: 'center' },
              content: { paddingHorizontal: 16, paddingTop: 12, paddingBottom: 24 },
              card: { backgroundColor: t.card, borderRadius: 18, padding: 16, borderWidth: 1, borderColor: t.border, marginBottom: 12 },
              title: { fontSize: 18, fontWeight: '900', color: t.text },
              text: { fontSize: 14, color: t.text },
              muted: { fontSize: 13, color: t.muted },
              row: { flexDirection: 'row', alignItems: 'center' },
            });
          }

          function useParentSharedStyles() {
            const { theme } = useAppTheme();
            syncTheme(theme);
            return useMemo(() => createStyles(theme || THEME), [theme]);
          }'''
          if old not in text:
              raise SystemExit('parentShared style hook pattern not found')
          text = text.replace(old, new, 1)
          if 'export const styles = createStyles(THEME);' not in text:
              marker = "function useParentSharedStyles() {"
              text = text.replace(marker, "export const styles = createStyles(THEME);\n\n" + marker, 1)
          shared.write_text(text, encoding='utf-8')

          ctx = Path('src/context/ParentChildContext.js')
          text = ctx.read_text(encoding='utf-8')
          old = '''      const childMap = {};
      let loaded = 0;
      const publish = () => {'''
          if old in text:
              new = '''      const childMap = {};
      let loaded = 0;
      const loadedIds = new Set();
      const markLoaded = (childId) => {
        if (loadedIds.has(childId)) return;
        loadedIds.add(childId);
        loaded += 1;
      };
      const publish = () => {'''
              text = text.replace(old, new, 1)
              text = text.replace('          loaded += 1;\n          if (loaded >= ids.length) publish(); else setChildren(Object.values(childMap));', '          markLoaded(childId);\n          if (loaded >= ids.length) publish(); else setChildren(Object.values(childMap));', 1)
              text = text.replace('          loaded += 1;\n          delete childMap[childId];\n          if (loaded >= ids.length) publish();', '          markLoaded(childId);\n          delete childMap[childId];\n          if (loaded >= ids.length) publish();', 1)
          ctx.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/parent/parentShared.js src/context/ParentChildContext.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: restore parent shared styles and stabilize child loading"
          git push