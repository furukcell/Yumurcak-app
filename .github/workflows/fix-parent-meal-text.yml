name: Fix parent meal text

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fix meal text helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/screens/parent/ParentSummaryScreen.js')
          text = path.read_text()
          text = text.replace("import { getMealPhoto } from '../../components/MealTodayCard';", "import { getMealText, getMealPhoto } from '../../components/MealTodayCard';")
          text = text.replace('getMealMenuText(', 'getMealText(')
          path.write_text(text)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/parent/ParentSummaryScreen.js .github/workflows/fix-parent-meal-text.yml
          git commit -m "fix: use shared parent meal text helper"
          git rm .github/workflows/fix-parent-meal-text.yml
          git commit -m "chore: remove temporary parent meal text workflow"
          git push