name: Fix Parent Summary Duplicate Helper

on:
  push:
    paths:
      - .github/workflows/fix-parent-summary-duplicate.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate local getMealText
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/screens/parent/ParentSummaryScreen.js')
          s = p.read_text(encoding='utf-8')
          pattern = r'\nfunction getMealText\(value\)\s*\{.*?\}\s*(?=\nfunction buildMealSummary)'
          s2, n = re.subn(pattern, '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one duplicate helper, removed {n}')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/parent/ParentSummaryScreen.js
          git rm .github/workflows/fix-parent-summary-duplicate.yml
          git commit -m "fix: remove duplicate parent meal helper"
          git push
