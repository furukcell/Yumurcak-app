name: EAS Update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Apply parent child integration
        run: |
          python .github/patch_parent_child.py
          rm -f .github/patch_parent_child.py
          git checkout HEAD -- .github/workflows/eas-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/parent/parentShared.js
          git diff --cached --quiet || git commit -m "feat(parent): integrate shared child selection"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Publish OTA update (preview)
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
